name: Build

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:
  workflow_call:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
       
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  

      # Restores and publishes the Windows .exe directly from Linux
      - name: Build Windows EXE
        run: |
          dotnet publish . -c Release -r win-x64 -o ./publish
             
      - name: get date/date 
        env:
          TZ: "America/Chicago"
        run: | 
          echo "NOW=$(date +'%m-%d-%Y-%I.%M.%S.%p')" >> $GITHUB_ENV
               
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false    
          tag_name: ${{ env.NOW }}
          body: ${{ github.event.head_commit.message }}
          files: ${{ github.workspace }}/publish/PKHeX.exe
          name: "Release ${{ env.NOW }}"
   
            